<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookshelf - リアル本棚</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>My Bookshelf</h1>
  <div class="header-actions">
    <button id="addBookBtn" class="btn btn-add">+ 本を追加</button>
    <button id="toggleViewBtn" class="btn btn-view">表示切替</button>
  </div>
</header>

<main class="bookshelf-container">
  <div class="bookcase" id="bookcase">
    <!-- Shelves will be generated by JS -->
  </div>
</main>

<!-- Book Detail Modal -->
<div class="modal-overlay" id="bookModal">
  <div class="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-body">
      <div class="modal-cover">
        <img id="modalCover" src="" alt="">
      </div>
      <div class="modal-info">
        <h2 id="modalTitle"></h2>
        <p class="modal-author" id="modalAuthor"></p>
        <p class="modal-desc" id="modalDesc"></p>
        <div class="modal-meta">
          <span class="modal-publisher" id="modalPublisher"></span>
          <span class="modal-year" id="modalYear"></span>
        </div>
        <a id="modalAffLink" class="btn btn-affiliate" href="#" target="_blank" rel="noopener noreferrer">
          Amazonで購入する
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Add Book Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal modal-add">
    <button class="modal-close" id="addModalClose">&times;</button>
    <h2>本を追加</h2>
    <form id="addBookForm">
      <div class="form-group">
        <label for="bookTitle">タイトル *</label>
        <input type="text" id="bookTitle" required>
      </div>
      <div class="form-group">
        <label for="bookAuthor">著者 *</label>
        <input type="text" id="bookAuthor" required>
      </div>
      <div class="form-group">
        <label for="bookCover">表紙画像URL</label>
        <input type="url" id="bookCover" placeholder="https://...">
      </div>
      <div class="form-group">
        <label for="bookColor">背表紙の色</label>
        <input type="color" id="bookColor" value="#2c5f2d">
      </div>
      <div class="form-group">
        <label for="bookThickness">厚さ</label>
        <select id="bookThickness">
          <option value="thin">薄い</option>
          <option value="medium" selected>普通</option>
          <option value="thick">厚い</option>
          <option value="very-thick">とても厚い</option>
        </select>
      </div>
      <div class="form-group">
        <label for="bookHeight">高さ</label>
        <select id="bookHeight">
          <option value="short">文庫</option>
          <option value="medium" selected>新書・単行本</option>
          <option value="tall">大判</option>
        </select>
      </div>
      <div class="form-group">
        <label for="bookDisplay">表示方法</label>
        <select id="bookDisplay">
          <option value="spine" selected>背表紙</option>
          <option value="cover">表紙（面出し）</option>
        </select>
      </div>
      <div class="form-group">
        <label for="bookDesc">説明</label>
        <textarea id="bookDesc" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label for="bookPublisher">出版社</label>
        <input type="text" id="bookPublisher">
      </div>
      <div class="form-group">
        <label for="bookYear">出版年</label>
        <input type="number" id="bookYear" min="1900" max="2030">
      </div>
      <div class="form-group">
        <label for="bookAffLink">アフィリエイトリンク</label>
        <input type="url" id="bookAffLink" placeholder="https://...">
      </div>
      <div class="form-group">
        <label for="bookShelf">棚の段</label>
        <select id="bookShelf">
          <option value="0">1段目</option>
          <option value="1">2段目</option>
          <option value="2">3段目</option>
          <option value="3">4段目</option>
          <option value="4">5段目</option>
        </select>
      </div>
      <button type="submit" class="btn btn-add">追加する</button>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
